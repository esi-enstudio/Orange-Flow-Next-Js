<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f97316">
    <title>Offline | OrangeFlow</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #fff7ed; color: #1f2937; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { margin-bottom: .5rem; color: #c2410c; }
      p { line-height: 1.6; }
      button { min-height: 44px; margin-top: 1rem; padding: .65rem 1.25rem; border: 0; border-radius: .75rem; background: #f97316; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to continue using OrangeFlow.</p>
      <p lang="bn">আপনি অফলাইনে আছেন। OrangeFlow ব্যবহার চালিয়ে যেতে ইন্টারনেটে সংযোগ করুন।</p>
      <button type="button" onclick="location.reload()">Try again · আবার চেষ্টা করুন</button>
    </main>
  </body>
</html>
