services:
  db:
    image: postgres:15-alpine
    container_name: orange_flow_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-orange_flow_dev_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: orange_flow_backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "${WEBHOOK_PORT:-8090}:${WEBHOOK_PORT:-8090}"
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-slim
    container_name: orange_flow_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
