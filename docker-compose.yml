services:
  db:
    image: postgres:15-alpine
    container_name: orange_flow_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-orange_flow_dev_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-orange_flow_dev_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=200

  redis:
    image: redis:7-alpine
    container_name: orange_flow_redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: orange_flow_backend
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${WEBHOOK_PORT:-8090}:${WEBHOOK_PORT:-8090}"
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/ngrok-bin:/app/ngrok-bin
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    # Production: uvicorn with multiple workers
    # command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --loop asyncio

  # Dev: run frontend directly on WSL2 host (avoids Docker filesystem bottleneck)
  #   cd frontend && npm install && npm run dev
  # Production: uncomment profiles line and use the command below
  whatsapp-service:
    build: ./whatsapp-service
    container_name: orange_flow_whatsapp
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SESSION_DIR=/data
    volumes:
      - wa_session:/data
    deploy:
      resources:
        limits:
          memory: 1G
  frontend:
    profiles: ["production"]
    image: node:20-slim
    container_name: orange_flow_frontend
    restart: always
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NODE_ENV=development
    command: sh -c "npm install && npm run build && npm start"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  wa_session:
