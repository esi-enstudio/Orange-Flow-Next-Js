services:
  db:
    image: postgres:15-alpine
    container_name: orange_flow_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-orange_flow_dev_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-orange_flow_dev_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=200

  redis:
    image: redis:7-alpine
    container_name: orange_flow_redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: orange_flow_backend
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${WEBHOOK_PORT:-8090}:${WEBHOOK_PORT:-8090}"
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/ngrok-bin:/app/ngrok-bin
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    # Production: uvicorn with multiple workers
    # command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --loop asyncio

  # WhatsApp Multi-Session Gateway (go-whatsapp-multi-session-rest-api)
  # NOTE: pinned to locally built :pgx-fixed — the published :latest image
  # (2025-12-21) predates upstream commit e678308c (2026-02-06, "Fix pgx DSN
  # for Postgres") and appends prefer_simple_protocol=true to the DSN, which
  # Postgres rejects with FATAL 42704. Rebuild via upstream source until a
  # newer image is published:
  #   git clone https://github.com/gdbrns/go-whatsapp-multi-session-rest-api
  #   docker build -t ghiovanidebrians/go-whatsapp-multi-session-rest-api:pgx-fixed .
  whatsapp-gateway:
    image: ghiovanidebrians/go-whatsapp-multi-session-rest-api:pgx-fixed
    container_name: orange_flow_wa_gateway
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7001:7001"
    environment:
      - ADMIN_SECRET_KEY=${WA_GATEWAY_ADMIN_KEY:-changeme-admin-secret}
      - JWT_SECRET_KEY=${WA_GATEWAY_JWT_KEY:-changeme-jwt-secret-min-32-chars-long}
      - SERVER_PORT=7001
      - WHATSAPP_DATASTORE_TYPE=postgres
      - WHATSAPP_DATASTORE_URI=postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@db:5432/${DB_NAME:-orange_flow_dev_db}?sslmode=disable
    deploy:
      resources:
        limits:
          memory: 512M
  frontend:
    profiles: ["production"]
    image: node:20-slim
    container_name: orange_flow_frontend
    restart: always
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NODE_ENV=development
    command: sh -c "npm install && npm run build && npm start"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
